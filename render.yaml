services:
  - type: web
    name: hisabflow-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hisabflow-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        sync: false   # set in Render dashboard: https://your-vercel-app.vercel.app
      - key: APP_URL
        sync: false   # set in Render dashboard: https://your-vercel-app.vercel.app
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false   # https://your-vercel-app.vercel.app/api/auth/google/callback
    healthCheckPath: /api/v1/health

databases:
  - name: hisabflow-db
    databaseName: hisabflow
    user: hisabflow
    plan: free
